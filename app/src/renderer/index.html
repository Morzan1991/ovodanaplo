<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <!--
      Szigorú CSP: a program semmit NEM tölt le a hálózatról — a betűtípusok is
      helyben vannak (lásd src/assets/betutipusok.css). Ezért a korábbi
      korábbi külső betűtípus-szolgáltatói engedélyek megszűntek.
      A connect-src 'self' csak a saját origint engedi (fejlesztéskor a Vite
      élő újratöltése) — külső címre így nem szivároghat ki adat.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ÓvodaNapló</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
